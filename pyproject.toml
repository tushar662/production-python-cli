[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-python-cli"
version = "0.1.0"
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest>=9.2,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["task_manager*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
